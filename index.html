<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們的地方</title>
<style>
:root{
  --bg:#f4f1ea; --fg:#2a2824; --muted:#7b756b; --line:#ddd6c8; --card:#fbf9f4; --mine:#efe6d6; --accent:#8a5a2b; --on-accent:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c1b18; --fg:#ebe5d9; --muted:#9b9385; --line:#38342d; --card:#25231f; --mine:#2f2b24; }
}
:root[data-theme="dark"]{ --bg:#1c1b18; --fg:#ebe5d9; --muted:#9b9385; --line:#38342d; --card:#25231f; --mine:#2f2b24; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;-webkit-tap-highlight-color:transparent}
.screen{display:none;min-height:100%}
.screen.on{display:flex;flex-direction:column}
.center{max-width:420px;width:100%;margin:auto;padding:32px 16px;text-align:center}
.brand{font-size:26px;font-weight:700;letter-spacing:2px;margin:0 0 8px;color:var(--accent)}
.welcome{color:var(--muted);margin:0 0 28px;white-space:pre-wrap;line-height:1.6}
input,textarea,select{font:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
textarea{resize:vertical}
label.f{display:block;text-align:left;font-size:14px;color:var(--muted);margin:14px 0 6px}
button{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 18px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px;font-size:14px}
button:disabled{opacity:.5}
.err{color:#b4442c;font-size:14px;min-height:20px;margin-top:10px}
.hint{color:var(--muted);font-size:13px;line-height:1.6}

/* 主畫面 */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;max-width:680px;margin:0 auto;padding:12px 16px 6px}
.top h1{font-size:19px;margin:0;color:var(--accent);letter-spacing:1px}
.top .who{font-size:13px;color:var(--muted)}
nav{display:flex;max-width:680px;margin:0 auto;padding:0 8px}
nav button{flex:1;border:none;background:none;border-radius:0;padding:10px 4px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none;max-width:680px;width:100%;margin:0 auto;padding:12px 16px 24px;flex:1}
.pane.on{display:block}

/* 聊天 */
#pane-chat.on{display:flex;flex-direction:column;padding-bottom:0}
#msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:84%;align-self:flex-start}
.msg.mine{align-self:flex-end}
.msg .meta{font-size:12px;color:var(--muted);margin:0 4px 3px}
.msg.mine .meta{text-align:right}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;white-space:pre-wrap;word-break:break-word;line-height:1.55;cursor:pointer}
.msg.mine .bubble{background:var(--mine)}
.msg.quoted .bubble{border-color:var(--accent)}
.acts{display:none;gap:4px;margin-top:2px}
.msg.mine .acts{justify-content:flex-end}
.msg.open .acts{display:flex}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
.composer{position:sticky;bottom:0;background:var(--bg);display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer textarea{min-height:46px;max-height:140px;resize:none}
.composer button{flex:none}

/* 今天 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:14px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:1px}
.topic{font-size:20px;line-height:1.6;white-space:pre-wrap}
.topic-by{font-size:13px;color:var(--muted);margin-top:6px}
.lamp{display:flex;flex-direction:column;align-items:center;gap:12px}
.lamp button{min-width:160px}
.lit{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lit span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--mine)}

/* 語錄 */
.quote{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:0 0 18px}
.quote p{margin:0 0 6px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.quote small{color:var(--muted);font-size:12px}

/* 管理 */
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.mrow .tag{font-size:12px;color:var(--muted);margin-left:6px}
.row2{display:flex;gap:8px;align-items:center}
.row2 input[type=color]{width:56px;height:46px;padding:4px}

/* 群規 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:18px;padding:22px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
.modal h3{margin:0 0 12px;color:var(--accent)}
.modal .rules{white-space:pre-wrap;line-height:1.7;margin-bottom:18px}
</style>
</head>
<body>

<!-- 尚未設定 -->
<div class="screen" id="s-missing">
  <div class="center">
    <p class="brand">還差一步</p>
    <p class="welcome">請先在 config.js 填入 Supabase 的網址與 anon key，並在 Supabase 執行 schema.sql。詳細步驟見 README。</p>
  </div>
</div>

<!-- 入口 -->
<div class="screen" id="s-entry">
  <div class="center">
    <p class="brand" id="e-name">我們的地方</p>
    <p class="welcome" id="e-welcome"></p>
    <label class="f" for="e-nick">你的暱稱</label>
    <input id="e-nick" maxlength="20" autocomplete="nickname">
    <label class="f" for="e-code">邀請碼</label>
    <input id="e-code" autocomplete="off">
    <div class="err" id="e-err"></div>
    <button class="primary" id="e-go" style="width:100%;margin-top:6px">進入</button>
    <p class="hint" style="margin-top:22px">這裡只有受邀的人才能進來。</p>
  </div>
</div>

<!-- 等待同意 -->
<div class="screen" id="s-pending">
  <div class="center">
    <p class="brand" id="p-name">我們的地方</p>
    <p class="welcome">已經收到你的加入申請，<br>等管理者同意後就能進來。</p>
    <button id="p-check" class="primary">再看看</button>
    <p><button class="ghost" id="p-leave">換一個暱稱</button></p>
  </div>
</div>

<!-- 主畫面 -->
<div class="screen" id="s-main">
  <header>
    <div class="top"><h1 id="m-name"></h1><span class="who" id="m-who"></span></div>
    <nav>
      <button data-tab="chat" class="on">聊天</button>
      <button data-tab="today">今天</button>
      <button data-tab="quotes">語錄</button>
      <button data-tab="admin" id="tab-admin" hidden>管理</button>
      <button data-tab="me">我</button>
    </nav>
  </header>

  <section class="pane on" id="pane-chat">
    <div id="msgs"><div class="empty">還沒有人說話。</div></div>
    <div class="composer">
      <textarea id="c-body" maxlength="1000" placeholder="說點什麼……" rows="1"></textarea>
      <button class="primary" id="c-send">送出</button>
    </div>
  </section>

  <section class="pane" id="pane-today">
    <div class="card" id="t-topic-card">
      <h2>今天的話題</h2>
      <div class="topic" id="t-topic"></div>
      <div class="topic-by" id="t-by"></div>
      <div id="t-edit" hidden style="margin-top:14px">
        <textarea id="t-input" maxlength="200" rows="2" placeholder="出一個今天的話題"></textarea>
        <button id="t-save" style="margin-top:8px">設定話題</button>
      </div>
    </div>
    <div class="card" id="t-ritual-card">
      <div class="lamp">
        <button class="primary" id="t-light"></button>
        <div class="lit" id="t-lit"></div>
        <div class="hint" id="t-count"></div>
      </div>
    </div>
  </section>

  <section class="pane" id="pane-quotes">
    <p class="hint">在聊天裡點一下訊息，選「收進語錄」，就會留在這裡。</p>
    <div id="q-list"></div>
  </section>

  <section class="pane" id="pane-admin">
    <div class="card">
      <h2>成員</h2>
      <div id="a-members"></div>
    </div>
    <div class="card">
      <h2>這個地方</h2>
      <label class="f">名稱</label><input id="a-name" maxlength="30">
      <label class="f">主題色</label>
      <div class="row2"><input type="color" id="a-color"><span class="hint">整個空間的代表色</span></div>
      <label class="f">入口那句話</label><textarea id="a-welcome" rows="2" maxlength="200"></textarea>
      <label class="f">群規（第一次進來會看到，留空則不顯示）</label><textarea id="a-rules" rows="4" maxlength="1000"></textarea>
      <label class="f">每日儀式按鈕（留空則不顯示）</label><input id="a-ritual" maxlength="20" placeholder="例：點一盞燈、簽到、早安">
      <label class="f">完成後顯示</label><input id="a-ritual-done" maxlength="20" placeholder="例：已點燈">
      <label class="f">今天的話題由誰出</label>
      <select id="a-topic"><option value="admin">只有管理者</option><option value="all">所有成員</option><option value="off">不使用話題</option></select>
      <label class="f">新成員加入</label>
      <select id="a-approve"><option value="true">需要管理者同意</option><option value="false">有邀請碼就直接進入</option></select>
      <div class="err" id="a-err"></div>
      <button class="primary" id="a-save">儲存設定</button>
    </div>
    <div class="card">
      <h2>更換邀請碼</h2>
      <p class="hint">舊的邀請碼會立即失效，已經加入的成員不受影響。</p>
      <input id="a-invite" placeholder="新的邀請碼（至少 6 個字）" autocomplete="off">
      <div class="err" id="a-inv-err"></div>
      <button id="a-inv-save">更換</button>
    </div>
  </section>

  <section class="pane" id="pane-me">
    <div class="card">
      <h2>我</h2>
      <p id="me-nick" style="font-size:18px;margin:0 0 6px"></p>
      <p class="hint">這台裝置會記住你。換手機或清除瀏覽器資料後，需要重新用邀請碼加入（會變成新的成員）。</p>
      <button id="me-rules" style="margin-right:8px">看群規</button>
      <button id="me-leave">在這台裝置登出</button>
    </div>
  </section>
</div>

<div class="modal" id="rules-modal">
  <div class="box">
    <h3>進門之前</h3>
    <div class="rules" id="rules-text"></div>
    <button class="primary" id="rules-ok" style="width:100%">我知道了</button>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const CFG = window.SPACE_CONFIG || {};
const store = {
  mem: {},
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return this.mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ this.mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete this.mem[k]; } }
};

async function rpc(fn, args){
  const r = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: Object.assign({ "apikey": CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      /^eyJ/.test(CFG.SUPABASE_ANON_KEY) ? { "Authorization": "Bearer " + CFG.SUPABASE_ANON_KEY } : {}),
    body: JSON.stringify(args || {})
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || ("連線失敗（" + r.status + "）"));
  return j;
}

function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hhmm(s){ const d = new Date(s); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function dayLabel(s){ const d = new Date(s); return (d.getMonth()+1) + "/" + d.getDate(); }
function applyBrand(c){
  if (!c) return;
  document.title = c.name;
  if (/^#[0-9a-fA-F]{6}$/.test(c.color)) {
    document.documentElement.style.setProperty("--accent", c.color);
    const n = parseInt(c.color.slice(1),16), lum = (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255));
    document.documentElement.style.setProperty("--on-accent", lum > 160 ? "#1c1b18" : "#ffffff");
  }
}

let token = store.get("os_token");
let me = null, conf = null, lastId = 0, timer = null, tab = "chat";

/* ---------- 入口 ---------- */
async function boot(){
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return show("s-missing");
  if (token){
    try{
      const w = await rpc("whoami", { p_token: token });
      if (w && w.status === "active") return enter(w);
      if (w && w.status === "pending"){ $("p-name").textContent = document.title; return show("s-pending"); }
    }catch(e){ /* 網路錯誤時留在入口 */ }
    if (token) { /* 被移除或失效 */ }
  }
  try{
    const info = await rpc("public_info");
    applyBrand(info);
    $("e-name").textContent = info.name; $("p-name").textContent = info.name;
    $("e-welcome").textContent = info.welcome;
    if (!info.ready) $("e-err").textContent = "這個空間還沒設定邀請碼（見 README 最後一步）。";
  }catch(e){ $("e-err").textContent = e.message; }
  show("s-entry");
}

$("e-go").onclick = async () => {
  const nick = $("e-nick").value.trim(), code = $("e-code").value.trim();
  $("e-err").textContent = "";
  if (!nick || !code) { $("e-err").textContent = "請填暱稱和邀請碼"; return; }
  $("e-go").disabled = true;
  try{
    const r = await rpc("join_space", { p_code: code, p_nickname: nick });
    token = r.token; store.set("os_token", token);
    if (r.status === "active") enter(await rpc("whoami", { p_token: token }));
    else show("s-pending");
  }catch(e){ $("e-err").textContent = e.message; }
  $("e-go").disabled = false;
};
$("e-code").addEventListener("keydown", e => { if (e.key === "Enter") $("e-go").click(); });

$("p-check").onclick = async () => {
  try{ const w = await rpc("whoami", { p_token: token }); if (w && w.status === "active") enter(w); else if (!w) leave(); }catch(e){}
};
$("p-leave").onclick = () => leave();
function leave(){ store.del("os_token"); token = null; me = null; clearInterval(timer); location.reload(); }

/* ---------- 主畫面 ---------- */
function enter(w){
  me = w; conf = w.config; applyBrand(conf);
  $("m-name").textContent = conf.name; $("m-who").textContent = w.nickname;
  $("me-nick").textContent = w.nickname + (w.is_admin ? "（管理者）" : "");
  $("tab-admin").hidden = !w.is_admin;
  $("me-rules").hidden = !conf.rules;
  show("s-main");
  const seenKey = "os_rules_seen";
  if (conf.rules && store.get(seenKey) !== conf.rules) showRules();
  lastId = 0; $("msgs").innerHTML = "";
  setTab("chat");
  clearInterval(timer);
  timer = setInterval(() => { if (document.visibilityState === "visible" && tab === "chat") loadFeed(); }, 3000);
}
function showRules(){ $("rules-text").textContent = conf.rules; $("rules-modal").classList.add("on"); }
$("rules-ok").onclick = () => { store.set("os_rules_seen", conf.rules); $("rules-modal").classList.remove("on"); };
$("me-rules").onclick = showRules;
$("me-leave").onclick = () => { if (confirm("登出後要用邀請碼重新加入，而且會是新的成員。確定嗎？")) leave(); };

document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
function setTab(t){
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + t));
  if (t === "chat") loadFeed(true);
  if (t === "today") loadToday();
  if (t === "quotes") loadQuotes();
  if (t === "admin") loadAdmin();
}

/* ---------- 聊天 ---------- */
let lastDay = "";
async function loadFeed(scroll){
  let rows;
  try{ rows = await rpc("feed", { p_token: token, p_after: lastId }); }
  catch(e){ if (/成員資格/.test(e.message)) leave(); return; }
  if (!rows.length) { if (scroll) window.scrollTo(0, document.body.scrollHeight); return; }
  const box = $("msgs");
  if (lastId === 0) box.innerHTML = "";
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
  rows.forEach(m => {
    const day = dayLabel(m.created_at);
    if (day !== lastDay){ box.appendChild(el("div","empty", day)).style.padding = "6px 0"; lastDay = day; }
    box.appendChild(renderMsg(m));
    lastId = Math.max(lastId, m.id);
  });
  if (scroll || nearBottom || rows.some(r => r.member_id === me.id)) window.scrollTo(0, document.body.scrollHeight);
}
function renderMsg(m){
  const mine = m.member_id === me.id;
  const d = el("div", "msg" + (mine ? " mine" : "") + (m.quoted ? " quoted" : ""));
  d.appendChild(el("div","meta", (mine ? "" : m.nickname + "　") + hhmm(m.created_at)));
  const b = el("div","bubble", m.body); d.appendChild(b);
  const acts = el("div","acts");
  const q = el("button","ghost", m.quoted ? "已在語錄" : "收進語錄");
  q.disabled = m.quoted;
  q.onclick = async (ev) => { ev.stopPropagation(); try{ await rpc("add_quote", { p_token: token, p_message_id: m.id }); q.textContent = "已在語錄"; q.disabled = true; d.classList.add("quoted"); }catch(e){ alert(e.message); } };
  acts.appendChild(q);
  if (me.is_admin){
    const del = el("button","ghost","刪除");
    del.onclick = async (ev) => { ev.stopPropagation(); if (!confirm("刪除這則訊息？")) return; try{ await rpc("admin_delete_message", { p_token: token, p_id: m.id }); d.remove(); }catch(e){ alert(e.message); } };
    acts.appendChild(del);
  }
  d.appendChild(acts);
  b.onclick = () => d.classList.toggle("open");
  return d;
}
async function send(){
  const t = $("c-body").value.trim(); if (!t) return;
  $("c-send").disabled = true;
  try{ await rpc("post", { p_token: token, p_body: t }); $("c-body").value = ""; autoGrow(); await loadFeed(true); }
  catch(e){ alert(e.message); }
  $("c-send").disabled = false;
}
$("c-send").onclick = send;
function autoGrow(){ const t = $("c-body"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
$("c-body").addEventListener("input", autoGrow);
$("c-body").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); });

/* ---------- 今天 ---------- */
async function loadToday(){
  let t; try{ t = await rpc("today", { p_token: token }); }catch(e){ return; }
  const mode = conf.topic_mode;
  $("t-topic-card").hidden = mode === "off";
  $("t-topic").textContent = t.topic ? t.topic.body : "今天還沒有話題。";
  $("t-by").textContent = t.topic ? "—— " + t.topic.nickname : "";
  const canEdit = mode === "all" || (mode === "admin" && me.is_admin);
  $("t-edit").hidden = !canEdit;
  $("t-ritual-card").hidden = !conf.ritual_label;
  const btn = $("t-light");
  btn.textContent = t.me_lit ? conf.ritual_done : conf.ritual_label;
  btn.disabled = t.me_lit;
  const lit = $("t-lit"); lit.innerHTML = "";
  t.lit.forEach(n => lit.appendChild(el("span", null, n)));
  $("t-count").textContent = t.lit.length ? `今天有 ${t.lit.length} 人` : "今天還沒有人";
}
$("t-save").onclick = async () => {
  const v = $("t-input").value.trim(); if (!v) return;
  try{ await rpc("set_topic", { p_token: token, p_body: v }); $("t-input").value = ""; loadToday(); }catch(e){ alert(e.message); }
};
$("t-light").onclick = async () => { try{ await rpc("light", { p_token: token }); loadToday(); }catch(e){ alert(e.message); } };

/* ---------- 語錄 ---------- */
async function loadQuotes(){
  let q; try{ q = await rpc("quotes_list", { p_token: token }); }catch(e){ return; }
  const box = $("q-list"); box.innerHTML = "";
  if (!q.length) box.appendChild(el("div","empty","還沒有收錄任何一句。"));
  q.forEach(x => {
    const d = el("div","quote");
    d.appendChild(el("p", null, x.body));
    d.appendChild(el("small", null, `${x.nickname}・${dayLabel(x.said_at)}　由 ${x.added_by} 收錄`));
    box.appendChild(d);
  });
}

/* ---------- 管理 ---------- */
async function loadAdmin(){
  let list; try{ list = await rpc("admin_members", { p_token: token }); }catch(e){ return; }
  const box = $("a-members"); box.innerHTML = "";
  list.forEach(m => {
    const row = el("div","mrow");
    const name = el("span", null, m.nickname);
    name.appendChild(el("span","tag", m.is_admin ? "管理者" : (m.status === "pending" ? "等待同意" : "")));
    row.appendChild(name);
    const acts = el("span");
    if (m.id !== me.id){
      if (m.status === "pending"){
        const ok = el("button", "primary", "同意"); ok.style.padding = "6px 12px";
        ok.onclick = () => setStatus(m.id, "active"); acts.appendChild(ok);
      }
      const rm = el("button","ghost", m.status === "pending" ? "拒絕" : "移除");
      rm.onclick = () => { if (confirm(`確定${rm.textContent}「${m.nickname}」？`)) setStatus(m.id, "removed"); };
      acts.appendChild(rm);
    }
    row.appendChild(acts); box.appendChild(row);
  });
  $("a-name").value = conf.name; $("a-color").value = conf.color;
  $("a-welcome").value = conf.welcome; $("a-rules").value = conf.rules;
  $("a-ritual").value = conf.ritual_label; $("a-ritual-done").value = conf.ritual_done;
  $("a-topic").value = conf.topic_mode; $("a-approve").value = String(conf.require_approval);
}
async function setStatus(id, s){ try{ await rpc("admin_set_status", { p_token: token, p_member_id: id, p_status: s }); loadAdmin(); }catch(e){ alert(e.message); } }
$("a-save").onclick = async () => {
  $("a-err").textContent = ""; $("a-err").style.color = "";
  const cfg = { name: $("a-name").value, color: $("a-color").value, welcome: $("a-welcome").value,
    rules: $("a-rules").value, ritual_label: $("a-ritual").value.trim(), ritual_done: $("a-ritual-done").value.trim(),
    topic_mode: $("a-topic").value, require_approval: $("a-approve").value === "true" };
  try{
    await rpc("admin_update_config", { p_token: token, p_cfg: cfg });
    const w = await rpc("whoami", { p_token: token }); me = w; conf = w.config; applyBrand(conf);
    $("m-name").textContent = conf.name; $("me-rules").hidden = !conf.rules;
    $("a-err").textContent = "已儲存 ✓"; $("a-err").style.color = "var(--muted)";
  }catch(e){ $("a-err").textContent = e.message; }
};
$("a-inv-save").onclick = async () => {
  $("a-inv-err").textContent = ""; $("a-inv-err").style.color = "";
  try{ await rpc("admin_set_invite", { p_token: token, p_code: $("a-invite").value }); $("a-invite").value = ""; $("a-inv-err").textContent = "已更換 ✓"; $("a-inv-err").style.color = "var(--muted)"; }
  catch(e){ $("a-inv-err").textContent = e.message; }
};

boot();
})();
</script>
